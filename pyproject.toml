[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "customer-churn-retention"
version = "0.1.0"
description = "Customer Churn and Retention Through Fulfilment Intelligence"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "joblib>=1.6.0",
    "langchain-groq>=1.1.3",
    "langfuse>=5.1.0",
    "langgraph>=1.2.19",
    "mcp[cli]>=1,<2",
    "pandas>=3.1.0",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.14.2",
    "pymilvus>=3.0.2",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "sentence-transformers>=6.2.0",
    "shap>=0.54.1",
    "sqlalchemy>=2.1.6",
    "streamlit>=1.66.1",
    "uvicorn[standard]>=0.54.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
